<!doctype html><html><head><meta charset=utf-8><title>Alien React Studio</title><style>body{background:#10191d;color:#e1f4e5;font:16px system-ui;max-width:1000px;margin:30px auto;padding:16px}button,input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #537467;background:#20362e;color:white;margin:4px}input{width:65%}canvas{width:100%;background:#000;border-radius:12px}button:disabled{opacity:.4}#status{color:#b5e99d}label{display:inline-block;margin:8px}a{color:#a8f28c}</style></head><body><h1>👽 Alien React Studio</h1><p>Local reaction recorder • webcam pixels never enter the output</p><input id=url placeholder="Paste YouTube or website URL"><button id=open>Open source tab</button><br><button id=setup>1. Enable alien & microphone</button><button id=share>2. Select source tab</button><button id=start disabled>3. Start recording</button><button id=pause disabled>Pause recording</button><button id=stop disabled>Finish & save</button><div><label>Quality <select id=quality><option value=720>720p</option><option value=1080>1080p</option></select></label><label>Alien size <input id=size type=range min=15 max=40 value=25 style="width:100px"></label><label>Source volume <input id=volume type=range min=0 max=100 value=65 style="width:100px"></label></div><p id=status>Open a source, then enable devices. Use headphones.</p><canvas id=out width=1280 height=720></canvas><p id=download></p><script type=module>
const $=id=>document.getElementById(id),c=$('out'),g=c.getContext('2d');let cam,mic,source,tracker,ac,dest,sg,rec,chunks=[],last=0,level=0,analyser,buf,raf,objectURL;let p={jaw:0,smile:0,left:0,right:0,brow:0,tilt:0,yaw:0};const video=()=>{let v=document.createElement('video');v.muted=true;v.autoplay=true;v.playsInline=true;return v};const face=video(),screen=video();const status=s=>$('status').textContent=s;function ready(){$('start').disabled=!(mic&&source&&source.active&&tracker)||!!(rec&&rec.state!=='inactive')}
$('open').onclick=()=>{try{let u=new URL($('url').value);if(!['https:','http:'].includes(u.protocol))throw Error('Use an HTTP(S) URL');window.open(u.href,'_blank','noopener')}catch(e){status(e.message)}};
$('setup').onclick=async()=>{try{$('setup').disabled=true;status('Loading face tracking model…');const {FaceLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm');const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');tracker=await FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},runningMode:'VIDEO',outputFaceBlendshapes:true,numFaces:1});cam=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,frameRate:24},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});mic=cam;face.srcObject=cam;await face.play();ac=new AudioContext();await ac.resume();dest=ac.createMediaStreamDestination();let m=ac.createMediaStreamSource(new MediaStream(cam.getAudioTracks()));analyser=ac.createAnalyser();analyser.fftSize=512;buf=new Uint8Array(512);m.connect(analyser);m.connect(dest);connectSource();status('Alien ready. Select the source tab and enable tab audio.');ready()}catch(e){status('Setup failed: '+e.message);cam?.getTracks().forEach(t=>t.stop());mic=null;tracker=null;$('setup').disabled=false}};
function connectSource(){if(!ac||!source)return;sg?.disconnect();if(source.getAudioTracks().length){sg=ac.createGain();sg.gain.value=+$('volume').value/100;ac.createMediaStreamSource(new MediaStream(source.getAudioTracks())).connect(sg);sg.connect(dest)}}$('volume').oninput=()=>{if(sg)sg.gain.value=+$('volume').value/100};
$('share').onclick=async()=>{try{if(rec&&rec.state!=='inactive')return;let s=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true});source?.getTracks().forEach(t=>t.stop());source=s;screen.srcObject=s;await screen.play();connectSource();s.getVideoTracks()[0].onended=()=>{if(rec&&rec.state!=='inactive')rec.stop();ready();status('Source sharing ended')};status(s.getAudioTracks().length?'Source ready. Start recording when ready.':'No source audio captured. Re-select a browser tab with Share tab audio enabled.');ready()}catch(e){status(e.message)}};
function ellipse(x,y,a,b,color,rot=0){g.beginPath();g.ellipse(x,y,Math.max(.1,a),Math.max(.1,b),rot,0,Math.PI*2);g.fillStyle=color;g.fill()}
function draw(t){raf=requestAnimationFrame(draw);if(t-last<32)return;last=t;let sec=t/1000;if(tracker&&face.readyState>=2){try{let r=tracker.detectForVideo(face,t),b=r.faceBlendshapes?.[0]?.categories,l=r.faceLandmarks?.[0];if(b&&l){let v=n=>b.find(x=>x.categoryName===n)?.score||0;let target={jaw:v('jawOpen'),smile:(v('mouthSmileLeft')+v('mouthSmileRight'))/2-(v('mouthFrownLeft')+v('mouthFrownRight'))/2,left:v('eyeBlinkLeft'),right:v('eyeBlinkRight'),brow:v('browInnerUp')-v('browDownLeft'),tilt:Math.atan2(l[263].y-l[33].y,l[263].x-l[33].x),yaw:(l[1].x-(l[33].x+l[263].x)/2)*5};for(let k in p)p[k]+=(target[k]-p[k])*.35}}catch(e){/* keep avatar visible */}}if(analyser){analyser.getByteTimeDomainData(buf);level=Math.min(1,Math.sqrt(buf.reduce((s,v)=>s+((v-128)/128)**2,0)/buf.length)*5)}g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);if(screen.readyState>=2){let scale=Math.min(c.width/screen.videoWidth,c.height/screen.videoHeight),w=screen.videoWidth*scale,h=screen.videoHeight*scale;g.drawImage(screen,(c.width-w)/2,(c.height-h)/2,w,h)}let s=c.width*+$('size').value/100/240;g.save();g.translate(c.width-125*s-15,c.height-130*s-10+Math.sin(sec*2)*2*s);g.scale(s,s);g.rotate(p.tilt+Math.sin(sec*1.1)*.018);g.scale(1-Math.min(.25,Math.abs(p.yaw)*.3),1);let skin=g.createRadialGradient(-35,-65,5,0,0,140);skin.addColorStop(0,'#d9ffad');skin.addColorStop(.45,'#8bd65b');skin.addColorStop(1,'#285d36');g.beginPath();g.moveTo(0,-115);g.bezierCurveTo(-105,-120,-120,-45,-90,18);g.bezierCurveTo(-65,78,-20,110,0,112);g.bezierCurveTo(20,110,65,78,90,18);g.bezierCurveTo(120,-45,105,-120,0,-115);g.fillStyle=skin;g.fill();for(let i of [-1,1]){let blink=i<0?p.left:p.right,h=28*(1-.96*blink)*(1+p.brow*.25);g.save();g.translate(i*43+p.yaw*10,-20);g.rotate(-i*.45);let eye=g.createRadialGradient(-10,-10,1,0,0,40);eye.addColorStop(0,'#43585c');eye.addColorStop(1,'#050b10');ellipse(0,0,35,h,eye);if(h>4)ellipse(-10,-h*.35,10,h*.18,'#eaffedbb');g.restore();ellipse(i*7,24,2.5,4,'#397b35');g.strokeStyle='#376e32';g.lineWidth=4;g.beginPath();g.moveTo(i*18,-55-p.brow*12);g.quadraticCurveTo(i*45,-75-p.brow*14,i*76,-56);g.stroke()}let jaw=Math.max(p.jaw,level*.35),w=23+p.smile*12,y=48-p.smile*12;g.beginPath();g.moveTo(-w,y);g.quadraticCurveTo(0,50,w,y);g.quadraticCurveTo(0,52+jaw*65,-w,y);g.fillStyle='#14251c';g.fill();if(jaw>.25)ellipse(0,49+jaw*22,10,jaw*6,'#cf7e89');g.restore()}requestAnimationFrame(draw);
$('start').onclick=()=>{try{if(!source?.active||!mic||!dest)return;let h=+$('quality').value;c.height=h;c.width=Math.round(h*16/9);let stream=c.captureStream(30);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let mime=['video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));rec=new MediaRecorder(stream,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:h===1080?5000000:2500000});chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:rec.mimeType});if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(blob);let a=document.createElement('a');a.href=objectURL;a.download='alien-reaction-'+new Date().toISOString().replace(/[:.]/g,'-')+'.webm';a.textContent='Download recording again';$('download').replaceChildren(a);a.click();stream.getVideoTracks().forEach(t=>t.stop());$('stop').disabled=$('pause').disabled=true;$('share').disabled=false; $('pause').textContent='Pause recording';ready();status('Recording saved. Review before uploading.')};rec.start(1000);$('start').disabled=$('share').disabled=true;$('stop').disabled=$('pause').disabled=false;status('Recording… keep this window visible and source tab playing.')}catch(e){status(e.message)}};$('pause').onclick=()=>{if(rec.state==='recording'){rec.pause();$('pause').textContent='Resume recording';status('Paused')}else if(rec.state==='paused'){rec.resume();$('pause').textContent='Pause recording';status('Recording…')}};$('stop').onclick=()=>{if(rec&&rec.state!=='inactive')rec.stop()};
</script></body></html>
